<!doctype html>
<html lang="en" data-theme-storage-key="theme-mode">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dhruv's Profile</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      ;(function () {
        try {
          const themeStorageKey = document.documentElement.dataset.themeStorageKey
          const storedTheme = localStorage.getItem(themeStorageKey)
          const themeMode =
            storedTheme === 'light' || storedTheme === 'dark'
              ? storedTheme
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.classList.add(themeMode)
        } catch (storageError) {
          document.documentElement.classList.add('dark')
        }
      })()
      ;(function () {
        const revealSymbols = function () {
          document.documentElement.classList.add('symbols-ready')
        }
        window.revealSymbolsWhenLoaded = function () {
          if (!document.fonts || !document.fonts.load) {
            revealSymbols()
            return
          }
          document.fonts.load('24px "Material Symbols Rounded"').then(revealSymbols, revealSymbols)
        }
        setTimeout(revealSymbols, 6000)
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
      rel="preload"
      as="style"
      onload="
        this.onload = null
        this.rel = 'stylesheet'
      "
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
      rel="preload"
      as="style"
      onload="
        this.onload = null
        this.rel = 'stylesheet'
        window.revealSymbolsWhenLoaded()
      "
      onerror="window.revealSymbolsWhenLoaded()"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
        rel="stylesheet"
      />
      <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
